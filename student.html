<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student List</title>

<style>
body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:#f4f7f4;
}

.container{
    width:85%;
    margin:40px auto;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#1a6b3a;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1a6b3a;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f8f8f8;
}

tr:hover{
    background:#e8f5e9;
}

button{
    background:#1a6b3a;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#f4a022;
}
</style>

</head>
