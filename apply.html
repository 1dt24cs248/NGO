<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Volunteer Application - HaritSeva NGO</title>

<style>
body{
    font-family:Poppins,sans-serif;
    background:#f4f7f4;
    margin:0;
}

.container{
    width:450px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1a6b3a;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#1a6b3a;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#f4a022;
}

.note{
    text-align:center;
    color:gray;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">

<h1>Volunteer Application</h1>

<form action="volunteer" method="post">

<input type="text" name="name" placeholder="Full Name" required>

<input type="email" name="email" placeholder="Email Address" required>

<input type="text" name="mobile" placeholder="Mobile Number" required>

<select name="role" required>
    <option value="">Select Area of Service</option>
     <option>Medical Camp</option>
  
    <option>Food Distribution</option>
    <option>Free Education</option>
    <option>Child Care</option>
    <option>Save water </option>
    <option>Old Age Home</option>
    <option>Goshala Services</option>
    <option>Environment Protection</option>
    <option>Clean Energy Awareness</option>
   
    
</select>

<textarea name="reason" rows="4"
placeholder="Why do you want to join HaritSeva NGO?"></textarea>

<button type="submit">Apply Now</button>

</form>

<p class="note">
Together we can make a difference 🌱
</p>

</div>

</body>
</html>
